runtime:
  role: node

server:
  host: "127.0.0.1"
  port: 8787

host:
  id: "local"
  display_name: "Local Mac"

display:
  dashboard_refresh_seconds: 2
  kindle_refresh_seconds: 20
  complete_high_visibility_seconds: 600
  complete_retention_seconds: 1800

agent:
  stale_after_seconds: 900

network:
  probe_address: "1.1.1.1:443"
  probe_timeout_milliseconds: 1500

