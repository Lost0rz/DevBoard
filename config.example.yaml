runtime:
  role: node

server:
  host: "127.0.0.1"
  port: 8787

host:
  id: "local"
  display_name: "Local Mac"

display:
  dashboard_refresh_seconds: 2
  kindle_refresh_seconds: 20
  complete_high_visibility_seconds: 600
  complete_retention_seconds: 1800

agent:
  stale_after_seconds: 900

network:
  probe_address: "1.1.1.1:443"
  probe_timeout_milliseconds: 1500

# M5.4 node→hub uplink (node role only; the hub must not set this section).
# When enabled, this node pushes sanitized PublicState snapshots to the hub
# every second and immediately on visible state change:
#   uplink:
#     enabled: true
#     endpoint: "https://hub.example.com"   # explicit http allowed on trusted LAN
#     node_id: "mac-a"                      # must equal host.id
#     token: "<per-node bearer token from the hub nodes registry>"

# HUB example:
# runtime:
#   role: hub
# server:
#   host: "0.0.0.0"
#   port: 8787
# display:
#   dashboard_refresh_seconds: 2
# nodes:
#   registered: "mac-a=Mac A=<token>,mac-b=Mac B=<token>"
#   # disabled: "mac-b"
multi_host:
  peers: ""
