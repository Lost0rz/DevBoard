name: Go CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go >= 1.24 emits Mach-O LC_UUID by default; the Go 1.23-era Darwin
      # linker fails on modern macOS ("dyld: missing LC_UUID load command").
      # CI therefore builds with a current supported toolchain while go.mod
      # keeps the Go 1.23 language/module compatibility floor.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Toolchain diagnostics
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/devboard

      - name: Diff check
        run: git diff --check

      - name: Validate deployment scripts
        run: |
          bash -n deploy/macos/*.sh
          sh -n deploy/hub/*.sh

      - name: Validate routine Hub deployment command
        run: |
          required="docker compose up -d --no-build"
          for file in deploy/hub/README.md deploy/hub/install.sh; do
            if ! grep -Fq "$required" "$file"; then
              echo "required no-build routine deployment command missing from $file" >&2
              exit 1
            fi
          done

          forbidden='(^|[;&|[:space:]])docker[[:space:]]+build([[:space:]]|$)|(^|[;&|[:space:]])docker[[:space:]]+compose[[:space:]]+build([[:space:]]|$)|(^|[;&|[:space:]])--build([[:space:]]|$)'
          if grep -nE "$forbidden" deploy/hub/install.sh; then
            echo "forbidden NAS-side image build path found in deploy/hub/install.sh" >&2
            exit 1
          fi

          readme_commands=$(awk '
            /^```/ { in_code = !in_code; next }
            in_code { print }
          ' deploy/hub/README.md)
          if printf '%s\n' "$readme_commands" | grep -nE "$forbidden"; then
            echo "forbidden NAS-side image build path found in README command examples" >&2
            exit 1
          fi

      - name: Validate LaunchAgent template
        if: runner.os == 'macOS'
        run: plutil -lint deploy/macos/com.devboard.node.plist.template

      - name: Build Hub container
        if: runner.os == 'Linux'
        run: docker build .

      - name: Validate Hub Compose model
        if: runner.os == 'Linux'
        run: docker compose -f deploy/hub/docker-compose.yml config

  # The repository declares `go 1.23.0` in go.mod as its language/module
  # compatibility floor. This lane proves that floor is still real: the
  # module must build and pass tests on Linux with the oldest supported
  # toolchain line. The main cross-platform matrix above stays on Go 1.26.x
  # because modern macOS requires an LC_UUID-emitting linker (Go >= 1.24);
  # Go 1.23 is deliberately NOT used on macOS 26.
  compat-go123:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Toolchain diagnostics
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/devboard
