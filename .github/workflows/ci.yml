name: Go CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go >= 1.24 emits Mach-O LC_UUID by default; the Go 1.23-era Darwin
      # linker fails on modern macOS ("dyld: missing LC_UUID load command").
      # CI therefore builds with a current supported toolchain while go.mod
      # keeps the Go 1.23 language/module compatibility floor.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Toolchain diagnostics
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/devboard

      - name: Diff check
        run: git diff --check
