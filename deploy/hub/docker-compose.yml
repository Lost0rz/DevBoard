# DevBoard Hub source-free NAS product deployment (Docker Compose).
#
# Load the verified prebuilt immutable image selected by DEVBOARD_HUB_IMAGE,
# then start with
# --no-build. Persistent config/admin state lives under ./data and is mounted
# at /var/lib/devboard.
# Hardened: read-only root filesystem, tmpfs /tmp, no-new-privileges, all
# capabilities dropped, no privileged container.
#
# Port is configurable: DEVBOARD_HUB_PORT=18787 docker compose up -d
services:
  devboard-hub:
    image: "${DEVBOARD_HUB_IMAGE:?DEVBOARD_HUB_IMAGE must be set to the verified immutable manifest image tag}"
    container_name: devboard-hub
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${DEVBOARD_UID:-65532}:${DEVBOARD_GID:-65532}"
    restart: unless-stopped
    ports:
      - "${DEVBOARD_HUB_PORT:-8787}:8787"
    command: ["serve", "--config", "/var/lib/devboard/config.yaml"]
    volumes:
      - ./data:/var/lib/devboard
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    privileged: false
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/devboard", "healthcheck", "--url", "http://127.0.0.1:8787/health", "--expect-role", "hub"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
