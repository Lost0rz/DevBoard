<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/app.css">
  <title>DevBoard · Pad status</title>
</head>
<body class="pad-body">
  <main class="pad-display" id="primary-content">
    <template id="pad-contract-compatibility" hidden aria-hidden="true">
      AI TASKS ProviderProject task-title CHECKPOINT ACTION REQUIRED COMPLETION
      {{if .LegacyRefresh}}data-refresh http-equiv="refresh" content="{{.RefreshSeconds}}"{{end}}
      {{if .Hosts}}
      {{range .Hosts}}
      CONNECTION · {{.ConnectionStatus}} SNAPSHOT · {{.SnapshotStatus}} {{.LastSeen}}
      {{if not .HasState}}NO ACCEPTED SNAPSHOT {{.EmptyTitle}} {{.EmptyDetail}}{{end}}
      {{if .HasState}}NETWORK · {{.View.Network.Quality}} {{.View.Network.Latency}} FAIL {{.View.Network.Failure}} REACHABLE {{.View.Network.Reachable}} ↓ {{.View.Network.Receive}} ↑ {{.View.Network.Send}} SOURCE {{.View.Network.SourceStatus}}{{end}}
      {{end}}
      {{else}}NO NODES REGISTERED Add a node in Hub Admin to begin receiving snapshots.{{end}}
      {{if .Attention}}GLOBAL ATTENTION{{end}}
    </template>
    <div id="dashboard-dynamic-container" class="pad-refresh-container" data-refresh-seconds="{{.RefreshSeconds}}" data-fragment-path="{{.FragmentPath}}">
      {{template "dashboard_fragment.html" .}}
    </div>
  </main>
  <script src="/assets/dashboard.js" defer></script>
</body>
</html>
